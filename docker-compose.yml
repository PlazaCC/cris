# Só o web: banco (Neon) e mídia (Vercel Blob) são serviços externos.
# As variáveis vêm de clients/web/.env (veja .env.example).
services:
  web:
    build:
      context: .
      dockerfile: clients/web/Dockerfile
    image: cris-web:latest
    restart: unless-stopped
    env_file:
      - clients/web/.env
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
    ports:
      - '8080:3000'
